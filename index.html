<body>

<h1>
  ToolDock | 無料Webツール集
</h1>

<p>
ToolDockは、無料で使える便利なWebツールをまとめたサイトです。ブラウザ上で簡単に利用でき、インストールは不要です。<br>
ツールのリクエストも受け付けています。依頼は下記「Contact」タブから匿名で送ることができます。
</p>

<!-- カテゴリ別のツール一覧。
     中身は js/tool-data.js を唯一の情報源として生成する。
     ここを手で書くと、ツールを足したときに載せ忘れる -->
<div id="tool-list"></div>

<h2>その他</h2>

<ul>
  <li><a href="/about/">About</a></li>
  <li><a href="/privacy/">Privacy Policy</a></li>
  <li><a href="/contact/">Contact</a></li>
</ul>

<script src="/js/tool-data.js"></script>

<script>
  document.getElementById("tool-list").innerHTML =
    Object.entries(window.CATEGORY_NAMES)
      .map(([key, name]) => {

        const items = TOOLS.filter(t => !t.hidden && t.category === key);

        if (items.length === 0) return "";

        return `
          <h2>${name}</h2>
          <ul>
            ${items.map(t => `<li><a href="${t.url}">${t.title}</a></li>`).join("")}
          </ul>
        `;
      })
      .join("");
</script>


<!-- 共通フッター -->
