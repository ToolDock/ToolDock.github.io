<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>カテゴリ | ToolDock</title>
  <meta name="description" content="カテゴリ別のツール一覧です。">
  <link rel="canonical" href="https://tooldock.github.io/category/">

  <script>
    const CURRENT_TOOL = "category";
  </script>

  <script src="/js/tool-data.js"></script>
  <script src="/js/head.js"></script>
  <script src="/js/analytics.js"></script>

  <style>

    body{
      font-family:sans-serif;
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    h1{
      margin-bottom:24px;
    }

    .tool-grid{
      display:grid;
      grid-template-columns:
        repeat(auto-fill,minmax(240px,1fr));
      gap:16px;
    }

    .tool-card{
      display:block;
      border:1px solid #ddd;
      border-radius:12px;
      padding:16px;
      text-decoration:none;
      color:inherit;
      transition:.2s;
    }

    .tool-card:hover{
      transform:translateY(-2px);
      border-color:#2563eb;
    }

    .tool-card h2{
      margin-top:0;
      margin-bottom:8px;
      font-size:18px;
    }

    .tool-card p{
      margin:0;
      color:#666;
      font-size:14px;
      line-height:1.6;
    }

  </style>

</head>

<body>

  <h1 id="category-title"></h1>

  <div class="tool-grid"
       id="tool-list"></div>

  <script>

    const params =
      new URLSearchParams(location.search);

    const cat = params.get("cat");

    /* cat 未指定、または未知のカテゴリ名のときは全ツールを並べる。
       静的な <title> をそのまま活かすため上書きしない */

    const isKnownCategory =
      cat !== null && Object.hasOwn(CATEGORY_NAMES, cat);

    const heading = isKnownCategory
      ? CATEGORY_NAMES[cat] + "ツール"
      : "すべてのツール";

    if (isKnownCategory) {
      document.title = heading + " | ToolDock";
    }

    document.getElementById(
      "category-title"
    ).textContent = heading;

    const list =
      TOOLS.filter(
        t => !t.hidden && (!isKnownCategory || t.category === cat)
      );

    const container =
      document.getElementById(
        "tool-list"
      );

    container.innerHTML =
      list.map(tool => `
        <a class="tool-card"
           href="${tool.url}">

          <h2>${tool.title}</h2>

          <p>${tool.desc}</p>

        </a>
      `).join("");

  </script>

<div id="related-tools"></div>
<script src="/js/related.js"></script>
</body>
</html>
