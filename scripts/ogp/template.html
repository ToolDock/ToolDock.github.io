<!DOCTYPE html>
<!--
  OGP画像（1200x630）のテンプレート。
  URLクエリ ?title=...&desc=... を読み、その場でDOMに差し込む。
  scripts/ogp/generate.js から、file://.../template.html?title=...&desc=...
  の形で開いてスクリーンショットする。単体でブラウザで開いても確認できる。

  色・配置は既存のOGP画像（ogp/kintoku.png など）をピクセル計測して
  そろえた実測値。
    バッジ・下部バー: #29A8F0（左上88,76〜205,193の117x117角丸バッジ）
    右上の円: #EAF4FE
    タイトル/ワードマーク文字: #111827
    説明文: #64748B
    ドメイン表記: #94A3B8
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #ffffff;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic",
                 "Yu Gothic Medium", "Yu Gothic", Meiryo, sans-serif;
  }
  .stage { position: relative; width: 1200px; height: 630px; }

  /* 右上の装飾円 */
  .circle {
    position: absolute; top: -170px; right: -100px;
    width: 460px; height: 460px; border-radius: 50%;
    background: #EAF4FE;
  }

  /* 左上のTDバッジ */
  .badge {
    position: absolute; left: 88px; top: 76px;
    width: 117px; height: 117px; border-radius: 24px;
    background: #29A8F0;
    display: flex; align-items: center; justify-content: center;
    color: #ffffff; font-weight: 800; font-size: 52px;
  }

  /* ワードマーク（バッジの右） */
  .word { position: absolute; left: 232px; top: 88px; }
  .word .name {
    font-size: 44px; font-weight: 800; color: #111827; line-height: 1;
  }
  .word .domain {
    margin-top: 10px; font-size: 21px; color: #94A3B8;
  }

  /* タイトル・説明文 */
  .title {
    position: absolute; left: 88px; top: 262px; width: 900px;
    font-size: 46px; font-weight: 800; color: #111827;
    line-height: 1.28;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .desc {
    position: absolute; left: 88px; top: 398px; width: 900px;
    font-size: 25px; color: #64748B; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 下部の帯 */
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
    background: #29A8F0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="circle"></div>
  <div class="badge">TD</div>
  <div class="word">
    <div class="name">ToolDock</div>
    <div class="domain">tooldock.github.io</div>
  </div>
  <div class="title" id="title"></div>
  <div class="desc" id="desc"></div>
  <div class="bar"></div>
</div>
<script>
  var params = new URLSearchParams(location.search);
  document.getElementById("title").textContent = params.get("title") || "";
  document.getElementById("desc").textContent = params.get("desc") || "";
</script>
</body>
</html>
