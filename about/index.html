  <h1>ToolDockについて</h1>

  <p>
    ToolDockは、無料で使えるWebツールをまとめたサイトです。
  </p>

  <p>
    日常作業を少し便利にすることを目的として、
    シンプルで使いやすいツールを公開しています。
  </p>

  <h2>公開中のツール</h2>

  <ul id="tool-list"></ul>

    今後も新しいツールを追加予定です。
  </p>

    © ToolDock
  </p>

  <script src="/js/tool-data.js"></script>

  <script>
    /* 一覧は js/tool-data.js を唯一の情報源として生成する */

    document.getElementById("tool-list").innerHTML =
      TOOLS
        .filter(t => !t.hidden)
        .map(t => `
          <li><a href="${t.url}">${t.title}</a></li>
        `).join("");
  </script>
