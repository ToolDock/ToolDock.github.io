name: probe-wiki
on:
  push:
    branches: [probe-wiki]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-wiki
      - run: |
          mkdir -p _probe/choushi
          curl -sSL -m 30 -A "Mozilla/5.0" -o _probe/choushi/page.html "https://junichi13.hatenadiary.org/entry/20080830/p2" || true
          grep -oE 'https?://[^"'"'"' ]+\.(gif|png|jpg)' _probe/choushi/page.html | grep -i fotolife | sort -u | head -20 > _probe/choushi/imgs.txt || true
          n=0; while read u; do n=$((n+1)); curl -sSL -m 30 -A "Mozilla/5.0" -o "_probe/choushi/img$n.${u##*.}" "$u" || true; done < _probe/choushi/imgs.txt
          ls -la _probe
          git config user.name probe; git config user.email probe@example.com
          git add _probe && git commit -m "probe data $(date -u +%H%M)" && git push
