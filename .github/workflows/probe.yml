name: probe-wiki
on:
  push:
    branches: [probe-wiki]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-wiki
      - run: |
          mkdir -p _probe
          curl -sSL -m 30 -A "Mozilla/5.0" -o _probe/tbs.html "https://www.tbs.co.jp/baseball-draft-tbs/" || true
          curl -sS -m 30 -A "ToolDock/1.0 (https://tooldock.github.io/)" -G "https://ja.wikipedia.org/w/api.php" \
            --data-urlencode "action=parse" --data-urlencode "page=2026年度新人選手選択会議 (日本プロ野球)" --data-urlencode "prop=wikitext" \
            --data-urlencode "format=json" --data-urlencode "formatversion=2" -o _probe/2026.json || true
          ls -la _probe
          git config user.name probe; git config user.email probe@example.com
          git add _probe && git commit -m "probe data $(date -u +%H%M)" && git push
