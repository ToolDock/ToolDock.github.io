name: probe-wiki
on:
  push:
    branches: [probe-wiki]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-wiki
      - run: |
          mkdir -p _probe
          curl -sS -m 30 -A "ToolDock/1.0 (https://tooldock.github.io/)" -G "https://ja.wikipedia.org/w/api.php" \
            --data-urlencode "action=parse" --data-urlencode "page=現役ドラフト" --data-urlencode "prop=wikitext" \
            --data-urlencode "format=json" --data-urlencode "formatversion=2" -o _probe/genekidraft.json || true
          ls -la _probe
          git config user.name probe; git config user.email probe@example.com
          git add _probe && git commit -m "probe data $(date -u +%H%M)" && git push
