# プロ野球マジックナンバーのページ（/magic/）と、
# WAR計算ツール（/war/）のリーグ平均値を毎日更新する。
#
# NPB公式の勝敗表・チーム成績を取り、npb/ のスクリプトで計算して書き出す。
# 標準ライブラリだけで動くので、依存のインストールはない。

name: マジックナンバーを更新

on:
  schedule:
    # ナイター終了後と翌朝。UTC 15:10 = 日本時間 0:10、UTC 22:10 = 日本時間 7:10
    - cron: "10 15 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-npb
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 勝敗表を取得して計算
        run: python npb/build_magic.py --out magic

      - name: チーム成績からリーグ平均を計算
        run: python npb/build_league.py --out war

      - name: 変更があればコミット
        run: |
          # 「最終更新」の時刻だけが変わった場合はコミットしない
          if git diff --quiet -- magic/data.json magic/history.json war/league.json; then
            echo "成績に変化なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add magic war/league.json
          git commit -m "chore: マジックナンバーとリーグ平均を更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            git push && break
            git pull --rebase
          done
