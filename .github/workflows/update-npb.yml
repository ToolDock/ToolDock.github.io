# プロ野球のデータページを毎日更新する。
#   /magic/  マジックナンバー（勝敗表から）
#   /war/    WAR計算ツールのリーグ平均（league.json）
#   /saber/  セイバーメトリクス ランキング
#   /draft/  ドラフト答え合わせ
#   /pythagorean/  運ランキング（ピタゴラス勝率）
#   /milestone/  記録達成カウントダウン
#   /kings/  いろんな「王」ランキング（部門別の上位5人）
#   /player/  選手ページ（全ページはシーズン終了時。毎日は新しい選手・在籍が変わった選手だけ）
#
# NPB公式の勝敗表・個人成績・ドラフト指名選手を取り、npb/ のスクリプトで計算して書き出す。
# 個人成績は npb/data/ に年ごとに保存し、過去の年は取り直さない。
# 標準ライブラリだけで動くので、依存のインストールはない。

name: プロ野球データを更新

on:
  schedule:
    # ナイター終了後と翌朝。UTC 15:10 = 日本時間 0:10、UTC 22:10 = 日本時間 7:10
    - cron: "10 15 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-npb
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 勝敗表を取得して計算
        run: python npb/build_magic.py --out magic

      - name: 個人成績とドラフト指名選手を取得
        run: python npb/stats_store.py --data npb/data

      - name: リーグ平均を計算
        run: python npb/build_league.py --data npb/data --out war

      - name: 選手ページを作成（全ページはシーズン終了時だけ）
        # 約2900ページあり、毎日作り直すとリポジトリの履歴が膨らむので、
        # 全ページは最新のシーズンが終わった最初の更新でだけ作る（player/built.json で判断）。
        # 毎日は、球団の選手一覧（npb/data/roster_<年度>.json）をもとに、検索用のデータと、
        # 新しく一軍に出た選手・移籍や退団で在籍が変わった選手のページだけを作る。
        # ランキング・ドラフトの選手名のリンクは player/built.json を見るので、それより先に作る
        run: python npb/build_players.py --data npb/data --league war/league.json --out player

      - name: セイバー指標のランキングを作成
        run: python npb/build_saber.py --data npb/data --league war/league.json --out saber

      - name: ドラフト答え合わせを作成
        run: python npb/build_draft.py --data npb/data --league war/league.json --out draft

      - name: 運ランキング（ピタゴラス勝率）を作成
        run: python npb/build_pythagorean.py --data npb/data --out pythagorean

      - name: 記録達成カウントダウンを作成
        run: python npb/build_milestone.py --data npb/data --league war/league.json --out milestone

      - name: 裏タイトル・逆タイトルを作成
        # 新しいシーズンが始まると、ツール名の年（「… 2026-2005」）も js/tool-data.js で書き換える
        run: python npb/build_kings.py --data npb/data --out kings

      - name: トップ・一覧のカードとサイトマップを作り直す
        # ツール名が変わったときのカードと、新しい年のドラフトのページをサイトマップに載せる
        run: python scripts/build_index.py

      - name: 変更があればコミット
        run: |
          # 「最終更新」の時刻だけが変わった場合はコミットしない。
          # テンプレートを直したときは本文が変わるので、それはコミットする。
          # 新しく増えたファイル（新しい年のデータ・ページ）があればコミットする
          if git diff --quiet -I '最終更新' -- magic war/league.json saber draft pythagorean milestone kings player npb/data sitemap.xml sitemap.txt js/tool-data.js index.html category/index.html \
             && [ -z "$(git status --porcelain --untracked-files=all -- saber draft pythagorean milestone kings player npb/data | grep '^??')" ]; then
            echo "成績に変化なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add magic war/league.json saber draft pythagorean milestone kings player npb/data sitemap.xml sitemap.txt js/tool-data.js index.html category/index.html
          git commit -m "chore: プロ野球データを更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            git push && break
            git pull --rebase
          done
